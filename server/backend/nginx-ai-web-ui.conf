# Rate limit zone: 500 requests per second per client IP (10MB shared memory zone)
limit_req_zone $binary_remote_addr zone=llm_rate_limit:10m rate=500r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirect all HTTP traffic to HTTPS on port 443
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Self-signed TLS certificate and private key
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HTTP Basic Authentication verified by Nginx
    auth_basic "Restricted Local LLM Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Apply 500 req/s rate limit across the server
    limit_req zone=llm_rate_limit burst=100 nodelay;

    # Serve Local LLM frontend static files
    root /opt/ai-web-ui/server/frontend;
    index index.html;

    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy API requests to the local FastAPI systemd service
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for LLM generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
