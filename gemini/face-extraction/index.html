<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gemini Face Extraction</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">
<div class="main-content">
<div class="container">
<div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
<button class="secondary-button" onclick="window.location.href='../../index.html'">← Back to Home</button>
<h1>Gemini Face Extraction</h1>
<div style="width: 100px;"></div> <!-- Spacer -->
</div>
<p class="explanation-note">
                    Upload images to detect and extract faces using Gemini models. 
                    The extracted faces will be saved as square images.
                </p>
<div class="summary-display" id="summaryDisplay" style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; display: none;">
<div style="display: flex; gap: 20px; justify-content: center; font-size: 0.9em;">
<span><strong>Total Tokens:</strong> <span id="totalTokens">0</span></span>
<span><strong>Estimated Cost:</strong> <span id="totalCost">$0.000000</span></span>
</div>
</div>
<div class="input-section">
<div class="api-key-container">
<label for="geminiApiKey">Gemini API Key:</label>
<input id="geminiApiKey" placeholder="Enter your Gemini API Key" type="text"/>
<button id="setApiKeyButton">Set Key</button>
</div>
<div class="model-select-container">
<label for="geminiModel">Select Model:</label>
<select id="geminiModel"><option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
                <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                <option selected="" value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                </select>
<label for="targetFaceSize" style="margin-left: 20px;">Output Size (px):</label>
<input id="targetFaceSize" max="2048" min="64" step="64" style="width: 100px; flex-grow: 0;" type="number" value="256"/>
</div>
<div class="image-upload-container">
<div class="upload-buttons">
<button id="uploadButton" onclick="document.getElementById('imageFileInput').click()">Upload Images</button>
<input accept="image/*" id="imageFileInput" multiple="" style="display: none;" type="file"/>
<button class="secondary-button" id="clearImagesButton">Clear All Inputs</button>
</div>
<div class="url-input-group" style="display: flex; gap: 10px; margin-top: 10px;">
<input id="imageUrlInput" placeholder="Enter image URL..." style="flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" type="text"/>
<button class="primary-button" id="addUrlButton" style="padding: 8px 15px;">Add URL</button>
</div>
<div class="image-preview-container" id="imagePreviewContainer"></div>
</div>
<div class="action-buttons">
<button class="primary-button" id="extractButton">Extract Faces</button>
<button class="secondary-button hidden" id="stopButton">Stop</button>
</div>
</div>
<div class="status-message" id="statusMessage"></div>
<div class="error-message" id="errorMessage"></div>
<div class="results-section">
<div class="results-header">
<h2>Extracted Faces</h2>
<div class="results-actions">
<button class="download-button" disabled="" id="downloadZipButton">Download All as ZIP</button>
<button class="remove-btn" id="clearFacesButton">Clear All Faces</button>
</div>
</div>
<div class="faces-gallery" id="facesGallery">
<!-- Extracted faces will appear here -->
</div>
</div>
<!-- Debug Section -->
<details class="debug-section">
<summary>Debug Info</summary>
<div id="debugContent">
<h3>Last API Request</h3>
<pre id="apiRequestBody"></pre>
<h3>Last API Response</h3>
<pre id="apiResponseBody"></pre>
</div>
</details>
</div>
</div>
</div>
<!-- JSZip for packaging files -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../price.js"></script>
<script src="face_extract.js"></script>
</body>
</html>
