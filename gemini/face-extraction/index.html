<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Face Extraction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <div class="main-content">
            <div class="container">
                <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <button onclick="window.location.href='../../index.html'" class="secondary-button">← Back to Home</button>
                    <h1>Gemini Face Extraction</h1>
                    <div style="width: 100px;"></div> <!-- Spacer -->
                </div>

                <p class="explanation-note">
                    Upload images to detect and extract faces using Gemini models. 
                    The extracted faces will be saved as square images.
                </p>

                <div class="summary-display" id="summaryDisplay" style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; display: none;">
                    <div style="display: flex; gap: 20px; justify-content: center; font-size: 0.9em;">
                        <span><strong>Total Tokens:</strong> <span id="totalTokens">0</span></span>
                        <span><strong>Estimated Cost:</strong> <span id="totalCost">$0.000000</span></span>
                    </div>
                </div>

                <div class="input-section">
                    <div class="api-key-container">
                        <label for="geminiApiKey">Gemini API Key:</label>
                        <input type="text" id="geminiApiKey" placeholder="Enter your Gemini API Key">
                        <button id="setApiKeyButton">Set Key</button>
                    </div>

                    <div class="model-select-container">
                        <label for="geminiModel">Select Model:</label>
                        <select id="geminiModel">
                            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash (Default)</option>
                            <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash-Lite</option>
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                            <option value="gemini-3.1-flash-lite-preview">Gemini 3.1 Flash-Lite Preview</option>
                            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                        </select>
                        
                        <label for="targetFaceSize" style="margin-left: 20px;">Output Size (px):</label>
                        <input type="number" id="targetFaceSize" value="256" min="64" max="2048" step="64" style="width: 100px; flex-grow: 0;">
                    </div>

                    <div class="image-upload-container">
                        <div class="upload-buttons">
                            <button id="uploadButton" onclick="document.getElementById('imageFileInput').click()">Upload Images</button>
                            <input type="file" id="imageFileInput" accept="image/*" multiple style="display: none;">
                            <button id="clearImagesButton" class="secondary-button">Clear All Inputs</button>
                        </div>
                        <div class="url-input-group" style="display: flex; gap: 10px; margin-top: 10px;">
                            <input type="text" id="imageUrlInput" placeholder="Enter image URL..." style="flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            <button id="addUrlButton" class="primary-button" style="padding: 8px 15px;">Add URL</button>
                        </div>
                        <div id="imagePreviewContainer" class="image-preview-container"></div>
                    </div>

                    <div class="action-buttons">
                        <button id="extractButton" class="primary-button">Extract Faces</button>
                        <button id="stopButton" class="secondary-button hidden">Stop</button>
                    </div>
                </div>

                <div id="statusMessage" class="status-message"></div>
                <div id="errorMessage" class="error-message"></div>

                <div class="results-section">
                    <div class="results-header">
                        <h2>Extracted Faces</h2>
                        <div class="results-actions">
                            <button id="downloadZipButton" class="download-button" disabled>Download All as ZIP</button>
                            <button id="clearFacesButton" class="remove-btn">Clear All Faces</button>
                        </div>
                    </div>
                    <div id="facesGallery" class="faces-gallery">
                        <!-- Extracted faces will appear here -->
                    </div>
                </div>

                <!-- Debug Section -->
                <details class="debug-section">
                    <summary>Debug Info</summary>
                    <div id="debugContent">
                        <h3>Last API Request</h3>
                        <pre id="apiRequestBody"></pre>
                        <h3>Last API Response</h3>
                        <pre id="apiResponseBody"></pre>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <!-- JSZip for packaging files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../price.js"></script>
    <script src="face_extract.js"></script>
</body>
</html>
