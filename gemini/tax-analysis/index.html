<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Tax Form Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <div class="main-content">
            <div class="container">
                <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <button onclick="window.location.href='../../index.html'" class="secondary-button">← Back to Home</button>
                    <h1>Gemini Tax Form Analysis</h1>
                    <div style="width: 100px;"></div> <!-- Spacer -->
                </div>

                <p class="explanation-note">
                    Upload tax forms (PDFs or Images like W-2, 1099, etc.). Gemini will analyze each form, identify its type, extract numerical fields, group identical forms, and calculate totals.
                </p>

                <div class="summary-display" id="summaryDisplay" style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; display: none;">
                    <div style="display: flex; gap: 20px; justify-content: center; font-size: 0.9em;">
                        <span><strong>Total Tokens:</strong> <span id="totalTokens">0</span></span>
                        <span><strong>Estimated Cost:</strong> <span id="totalCost">$0.000000</span></span>
                    </div>
                </div>

                <div class="input-section">
                    <div class="api-key-container">
                        <label for="geminiApiKey">Gemini API Key:</label>
                        <input type="text" id="geminiApiKey" placeholder="Enter your Gemini API Key">
                        <button id="setApiKeyButton">Set Key</button>
                    </div>

                    <div class="model-select-container">
                        <label for="geminiModel">Select Model:</label>
                        <select id="geminiModel">
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                            <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash-Lite</option>
                            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                            <option value="gemini-3.1-flash-lite-preview" selected>Gemini 3.1 Flash-Lite Preview (Default)</option>
                            <option value="gemini-3-pro-preview">Gemini 3.0 Pro Preview</option>
                            <option value="gemini-3-flash-preview">Gemini 3.0 Flash Preview</option>
                        </select>
                    </div>

                    <div class="file-upload-container">
                        <div class="upload-buttons">
                            <button id="uploadButton" onclick="document.getElementById('fileInput').click()">Upload Tax Forms</button>
                            <input type="file" id="fileInput" accept="application/pdf, image/jpeg, image/png, image/webp" multiple style="display: none;">
                            <button id="clearFilesButton" class="secondary-button">Clear Files</button>
                        </div>
                        <div id="filePreviewContainer" class="file-preview-container"></div>
                    </div>

                    <div class="action-buttons">
                        <button id="analyzeButton" class="primary-button">Analyze Tax Forms</button>
                        <button id="stopButton" class="secondary-button hidden">Stop</button>
                    </div>
                </div>

                <div id="statusMessage" class="status-message"></div>
                <div id="errorMessage" class="error-message"></div>

                <div class="results-section" id="resultsSection" style="display: none;">
                    <h2>Extracted Tax Data</h2>
                    <div id="tablesContainer" class="tables-container">
                        <!-- Tables will be dynamically inserted here -->
                    </div>
                </div>

                <!-- Debug Section -->
                <details class="debug-section">
                    <summary>Debug Info</summary>
                    <div id="debugContent">
                        <h3>Last API Response</h3>
                        <pre id="apiResponseBody"></pre>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script src="../price.js"></script>
    <script src="tax_analysis.js"></script>
</body>
</html>
