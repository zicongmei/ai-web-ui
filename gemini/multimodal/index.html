<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gemini Multimodal Vision</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div class="header">Gemini Multimodal Vision</div>
<div class="container">
<!-- API Key Section -->
<div class="api-key-section">
<label for="geminiApiKey">Gemini API Key:</label>
<input id="geminiApiKey" placeholder="Enter your API Key here" type="text"/>
<button id="setApiKeyButton">Set API Key</button>
</div>
<!-- Model Selection -->
<div class="model-selection-section">
<label for="geminiModel">Model:</label>
<select id="geminiModel"><option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
                <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                <option selected="" value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                </select>
</div>
<!-- Input Area -->
<div class="input-area">
<label for="promptInput">Prompt:</label>
<textarea id="promptInput" placeholder="Describe the images or ask a question..." rows="4"></textarea>
<div class="input-options">
<div class="file-input-group">
<label class="custom-file-upload" for="imageFileInput">
<span>Select Images</span>
</label>
<input accept="image/*" id="imageFileInput" multiple="" type="file"/>
<button class="camera-button" id="takePhotoButton">Take Photo</button>
<input accept="image/*" capture="environment" class="hidden" id="cameraInput" type="file"/>
</div>
<div class="url-input-group">
<input id="imageUrlInput" placeholder="Enter image URL here..." type="text"/>
<button id="addUrlButton">Add URL</button>
</div>
</div>
<div class="image-preview-container" id="imagePreviewContainer"></div>
<div class="actions">
<button id="submitButton">Analyze Images</button>
<button class="hidden" id="stopButton">Stop</button>
</div>
</div>
<!-- Progress and Messages -->
<div class="status-message" id="statusMessage"></div>
<div class="error-message" id="errorMessage"></div>
<!-- Output Area -->
<div class="output-area">
<label>Response:</label>
<div class="text-output" id="textOutput"></div>
</div>
<!-- Stats -->
<div class="stats-section">
<div class="stats-card">
<div class="stats-label">Current Request</div>
<div id="currentTokenStats">Tokens: In 0, Out 0</div>
<div id="currentCostStats">Cost: $0.000000</div>
</div>
<div class="stats-card">
<div class="stats-label">Total Usage</div>
<div id="totalTokenStats">Tokens: In 0, Out 0</div>
<div id="totalCostStats">Total Cost: $0.000000</div>
</div>
</div>
<!-- Debug Area -->
<div class="debug-section">
<button id="toggleDebugButton">Toggle Debug Info</button>
<div class="hidden" id="debugContent">
<h4>Last API Request</h4>
<pre id="apiRequestBody"></pre>
<h4>Last API Response</h4>
<pre id="apiResponseBody"></pre>
</div>
</div>
</div>
<script src="../price.js"></script>
<script src="multimodal.js"></script>
</body>
</html>
