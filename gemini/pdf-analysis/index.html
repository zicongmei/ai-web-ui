<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gemini PDF Analysis</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">
<div class="main-content">
<div class="container">
<div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
<button class="secondary-button" onclick="window.location.href='../../index.html'">← Back to Home</button>
<h1>Gemini Document Analysis</h1>
<div style="width: 100px;"></div> <!-- Spacer -->
</div>
<p class="explanation-note">
                    Upload documents (PDFs, text files, code, etc.) and ask Gemini to analyze, summarize, or extract information from them.
                </p>
<div class="summary-display" id="summaryDisplay" style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; display: none;">
<div style="display: flex; gap: 20px; justify-content: center; font-size: 0.9em; flex-wrap: wrap;">
<span><strong>Input Tokens:</strong> <span id="inputTokens">0</span></span>
<span><strong>Output Tokens:</strong> <span id="outputTokens">0</span></span>
<span><strong>Total Tokens:</strong> <span id="totalTokens">0</span></span>
<span><strong>Estimated Cost:</strong> <span id="totalCost">$0.000000</span></span>
<span><strong>Call Time:</strong> <span id="callTime">0ms</span></span>
</div>
</div>
<div class="input-section">
<div class="api-key-container">
<label for="geminiApiKey">Gemini API Key:</label>
<input id="geminiApiKey" placeholder="Enter your Gemini API Key" type="text"/>
<button id="setApiKeyButton">Set Key</button>
</div>
<div class="model-select-container">
<label for="geminiModel">Select Model:</label>
<select id="geminiModel"><option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                <option selected="" value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite (Default)</option>
                <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                </select>
</div>
<div class="pdf-upload-container">
<div class="upload-buttons">
<button id="uploadButton" onclick="document.getElementById('pdfFileInput').click()">Upload Files</button>
<input id="pdfFileInput" multiple="" style="display: none;" type="file"/>
<button class="secondary-button" id="clearPdfsButton">Clear All Inputs</button>
</div>
<div class="url-input-group" style="display: flex; gap: 10px; margin-top: 10px;">
<input id="fileUrlInput" placeholder="Enter document URL..." style="flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" type="text"/>
<button class="primary-button" id="addUrlButton" style="padding: 8px 15px;">Add URL</button>
<button class="secondary-button" id="clearUrlButton" style="padding: 8px 15px;">Clear URL</button>
</div>
<div class="pdf-preview-container" id="pdfPreviewContainer"></div>
</div>
<div class="prompt-container">
<label for="promptInput">Prompt:</label>
<textarea id="promptInput" placeholder="What would you like to know about these documents?"></textarea>
</div>
<div class="action-buttons">
<button class="primary-button" id="analyzeButton">Analyze Documents</button>
<button class="secondary-button hidden" id="stopButton">Stop</button>
</div>
</div>
<div class="status-message" id="statusMessage"></div>
<div class="error-message" id="errorMessage"></div>
<div class="results-section">
<h2>Analysis Result</h2>
<div class="text-output" id="textOutput"></div>
</div>
<!-- Debug Section -->
<details class="debug-section">
<summary>Debug Info</summary>
<div id="debugContent">
<h3>API History</h3>
<div id="apiHistoryContainer" style="display: flex; flex-direction: column-reverse; gap: 20px;"></div>
</div>
</details>
</div>
</div>
</div>
<script src="../price.js"></script>
<script src="pdf_analysis.js"></script>
</body>
</html>
