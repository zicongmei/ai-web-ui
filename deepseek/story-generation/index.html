<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek AI Story Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>DeepSeek AI Story Generator</h1>

        <div id="errorDisplay" class="error-message hidden"></div>

        <div class="input-group">
            <label for="storyOutput">Story So Far (editable):</label>
            <textarea id="storyOutput" rows="20" placeholder="Start writing your story here, or leave blank and provide a prompt for the first paragraph."></textarea>
        </div>
        <div class="input-group">
            <label for="nextParagraphPrompt">What should happen in the next paragraph?</label>
            <div class="next-paragraph-input-controls">
                <textarea id="nextParagraphPrompt" rows="3" placeholder="e.g., The hero encounters a mysterious old woman who offers a cryptic warning."></textarea>
                <button id="clearNextParagraphPromptBtn" type="button" class="secondary-btn clear-prompt-btn">Clear</button>
            </div>
        </div>
        
        <div class="action-buttons">
            <button id="generateBtn">Generate Next Paragraph</button>
            <button id="stopBtn" class="stop-btn hidden">Stop Generation</button>
        </div>
        
        <button id="revertLastParagraphBtn" class="secondary-btn" disabled>Remove Last Paragraph</button>
        <button id="clearAllBtn" class="secondary-btn">Clear All Contents</button>  
        <div id="loadingIndicator" class="hidden">Generating...</div>

         <div class="input-group">
            <label for="systemInstruction">System Instruction for DeepSeek:</label>
            <textarea id="systemInstruction" rows="4" placeholder="例如：你是一位奇幻小说作家。请用生动有趣的文笔写作。保持段落相对简短。"></textarea>
        </div>

        <div class="input-group">
            <label for="apiKey">DeepSeek API Key:</label>
            <textarea id="apiKey" rows="1" placeholder="Enter your DeepSeek API Key"></textarea>
        </div>

        <div class="input-group">
            <label for="modelSelect">Select Model:</label>
            <select id="modelSelect">
                <option value="deepseek-chat" selected>deepseek-chat (V3)</option>
                <option value="deepseek-reasoner">deepseek-reasoner (R1)</option>
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
        </div>

        <div class="token-display-group">
            <p><strong>Input tokens for current request:</strong> <span id="currentRequestInputTokens">0</span></p>
            <p><strong>Output tokens for current request:</strong> <span id="currentRequestOutputTokens">0</span></p>
            <p><strong>Cost for current request:</strong> <span id="currentRequestCost">$0.000000</span></p>
            <hr>
            <p><strong>Accumulated input tokens:</strong> <span id="accumulatedInputTokens">0</span></p>
            <p><strong>Accumulated output tokens:</strong> <span id="accumulatedOutputTokens">0</span></p>
            <p><strong>Total accumulated tokens:</strong> <span id="accumulatedTokens">0</span></p> 
            <p><strong>Total accumulated cost:</strong> <span id="accumulatedCost">$0.000000</span></p>
        </div>
    </div>

    <!-- Debug Button and Panel -->
    <div id="debugContainer">
        <button id="debugToggleBtn" class="debug-toggle-btn">Debug</button>
        <div id="debugPanel" class="debug-panel hidden">
            <div class="debug-header">
                <h3>DeepSeek API Logs</h3>
                <button id="clearDebugLogsBtn" class="secondary-btn debug-clear-btn">Clear Logs</button>
            </div>
            <div id="debugLogs" class="debug-logs-content">
                <!-- Logs will be inserted here -->
            </div>
        </div>
    </div>

    <script src="../price.js"></script>
    <script src="story.js"></script>
</body>
</html>
