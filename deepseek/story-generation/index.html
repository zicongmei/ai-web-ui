<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek AI Story Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>DeepSeek AI 故事生成器</h1>

        <div id="errorDisplay" class="error-message hidden"></div>

        <div class="input-group">
            <label for="storyOutput">目前的故事（可编辑）：</label>
            <textarea id="storyOutput" rows="20" placeholder="在此处开始编写您的故事，或者留空并为第一段提供提示。"></textarea>
        </div>
        <div class="input-group">
            <label for="nextParagraphPrompt">下一段应该发生什么？</label>
            <div class="next-paragraph-input-controls">
                <textarea id="nextParagraphPrompt" rows="3" placeholder="例如：主角遇到了一位神秘的老妇人，她给出了一个晦涩的警告。"></textarea>
                <button id="clearNextParagraphPromptBtn" type="button" class="secondary-btn clear-prompt-btn">清除</button>
            </div>
        </div>
        
        <div class="action-buttons">
            <button id="generateBtn">生成下一段</button>
            <button id="stopBtn" class="stop-btn hidden">停止生成</button>
        </div>
        
        <button id="revertLastParagraphBtn" class="secondary-btn" disabled>删除最后一段</button>
        <button id="clearAllBtn" class="secondary-btn">清除所有内容</button>  
        <div id="loadingIndicator" class="hidden">正在生成...</div>

         <div class="input-group">
            <label for="systemInstruction">给 DeepSeek 的系统指令：</label>
            <textarea id="systemInstruction" rows="4" placeholder="例如：你是一位奇幻小说作家。请用生动有趣的文笔写作。保持段落相对简短。"></textarea>
        </div>

        <div class="input-group">
            <label for="apiKey">DeepSeek API Key：</label>
            <textarea id="apiKey" rows="1" placeholder="输入您的 DeepSeek API Key"></textarea>
        </div>

        <div class="input-group">
            <label for="modelSelect">选择模型：</label>
            <select id="modelSelect">
                <option value="deepseek-chat" selected>deepseek-chat (V3)</option>
                <option value="deepseek-reasoner">deepseek-reasoner (R1)</option>
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
        </div>

        <div class="token-display-group">
            <p><strong>当前请求输入 Token：</strong> <span id="currentRequestInputTokens">0</span></p>
            <p><strong>当前请求输出 Token：</strong> <span id="currentRequestOutputTokens">0</span></p>
            <p><strong>当前请求费用：</strong> <span id="currentRequestCost">$0.000000</span></p>
            <hr>
            <p><strong>累计输入 Token：</strong> <span id="accumulatedInputTokens">0</span></p>
            <p><strong>累计输出 Token：</strong> <span id="accumulatedOutputTokens">0</span></p>
            <p><strong>累计总 Token：</strong> <span id="accumulatedTokens">0</span></p> 
            <p><strong>累计总费用：</strong> <span id="accumulatedCost">$0.000000</span></p>
        </div>
    </div>

    <!-- Debug Button and Panel -->
    <div id="debugContainer">
        <button id="debugToggleBtn" class="debug-toggle-btn">调试</button>
        <div id="debugPanel" class="debug-panel hidden">
            <div class="debug-header">
                <h3>DeepSeek API 日志</h3>
                <button id="clearDebugLogsBtn" class="secondary-btn debug-clear-btn">清除日志</button>
            </div>
            <div id="debugLogs" class="debug-logs-content">
                <!-- Logs will be inserted here -->
            </div>
        </div>
    </div>

    <script src="../price.js"></script>
    <script src="story.js"></script>
</body>
</html>
